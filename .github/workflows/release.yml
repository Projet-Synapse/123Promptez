name: Release

# Builds Web, Android (installable APK) and Desktop (Windows/macOS/Linux) artifacts.
# - Push a tag like `v1.2.0` to build everything and publish a GitHub Release.
# - Or run manually (workflow_dispatch) to just validate the builds without publishing.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx expo export --platform web --output-dir dist
      - name: Zip web build
        run: cd dist && zip -r ../123Promptez-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: 123Promptez-web.zip
          if-no-files-found: error

  build-android:
    name: Build Android (installable APK)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free disk space (GitHub-hosted runners are tight on space for a full native Android build)
        # NOTE: don't touch $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache) —
        # that's where actions/setup-java just installed the JDK.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost || true
          df -h /
      - run: pnpm install --frozen-lockfile
      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build APK
        working-directory: android
        # `assembleRelease`, NOT `assembleDebug`: React Native's Gradle plugin
        # only bundles the JS + assets into the APK for release-type builds —
        # a debug build expects a live Metro dev server instead and produces
        # an APK with no JS bundle at all (installs, then fails to launch).
        # This is still trivially installable/testable: Expo's generated
        # build.gradle signs the "release" buildType with the debug keystore
        # by default (no real signing/Play Store cert involved). Single ABI
        # keeps the native-module compile step (reanimated, skia, webrtc,
        # maps, ...) fast enough for CI.
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk 123Promptez-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: 123Promptez-android.apk
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx expo export --platform web --output-dir dist
      - name: Build desktop installer
        run: npx electron-builder --publish never
        env:
          # Speeds up / stabilizes electron-builder in CI.
          USE_HARD_LINKS: 'false'
      - name: Collect installer artifacts (exclude unpacked debug dirs)
        shell: bash
        run: |
          mkdir -p out
          find release -maxdepth 1 -type f \
            \( -iname '*.dmg' -o -iname '*.zip' -o -iname '*.exe' -o -iname '*.AppImage' -o -iname '*.deb' \) \
            -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-web, build-android, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -iname '*.zip' -o -iname '*.apk' -o -iname '*.dmg' -o \
            -iname '*.exe' -o -iname '*.AppImage' -o -iname '*.deb' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
