name: Release

# Builds Web, Android (installable APK) and Desktop (Windows/macOS/Linux) artifacts.
# - Push a tag like `v1.2.0` to build everything and publish a GitHub Release.
# - Or run manually (workflow_dispatch) to just validate the builds without publishing.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx expo export --platform web --output-dir dist
      - name: Zip web build
        run: cd dist && zip -r ../123Promptez-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: 123Promptez-web.zip
          if-no-files-found: error

  build-android:
    name: Build Android (installable APK)
    runs-on: ubuntu-latest
    # 4 ABI + native modules (reanimated, skia, webrtc…) : largeur généreuse.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free disk space (GitHub-hosted runners are tight on space for a full native Android build)
        # NOTE: don't touch $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache) —
        # that's where actions/setup-java just installed the JDK.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost || true
          df -h /
      - run: pnpm install --frozen-lockfile
      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install
      # Signature stable (même méthode que 123Créez) : Expo signe la version
      # « release » avec android/app/debug.keystore (alias androiddebugkey /
      # mots de passe « android »). On remplace ce fichier par NOTRE clé
      # commitée, sans patcher le build.gradle généré.
      - name: Installer la clé de signature
        run: cp scripts/android/promptez.keystore android/app/debug.keystore
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      # Maven Central peut couper hermes-android (« Read timed out ») :
      # délais HTTP Gradle allongés + essais multiples.
      - name: Délais réseau Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          systemProp.org.gradle.internal.http.socketTimeout=300000
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=8
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          PROPS
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      # Pré-génère les artefacts codegen des turbo modules : sans ça, la
      # configuration CMake peut démarrer avant la création des cibles
      # « react_codegen_* » (race « Cannot specify link libraries »).
      - name: Pré-générer le codegen
        working-directory: android
        timeout-minutes: 20
        run: ./gradlew generateCodegenArtifactsFromSchema --no-daemon || true
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
      # Pas de -PreactNativeArchitectures : 4 ABI comme 123Créez / 123Écriture.
      # lintVital exclu — l'analyse Play Store saturait la mémoire du runner.
      # `assembleRelease` (pas debug) : RN ne bundle le JS que pour release.
      - name: Construire l'APK (essai 1)
        working-directory: android
        timeout-minutes: 60
        run: ./gradlew --build-cache assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
      - name: Construire l'APK (essai 2 après échec)
        if: failure()
        working-directory: android
        timeout-minutes: 60
        run: ./gradlew --build-cache assembleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk 123Promptez-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: 123Promptez-android.apk
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx expo export --platform web --output-dir dist
      - name: Relocate icon font assets for electron-builder
        run: node scripts/relocate-desktop-assets.js dist
      - name: Build desktop installer
        run: npx electron-builder --publish never
        env:
          # Speeds up / stabilizes electron-builder in CI.
          USE_HARD_LINKS: 'false'
      - name: Collect installer artifacts (exclude unpacked debug dirs)
        shell: bash
        run: |
          mkdir -p out
          # Les manifestes latest*.yml (et les blockmaps du téléchargement
          # différentiel) sont indispensables à electron-updater côté app
          # installée : sans eux, pas de mise à jour automatique.
          find release -maxdepth 1 -type f \
            \( -iname '*.dmg' -o -iname '*.zip' -o -iname '*.exe' -o -iname '*.AppImage' -o -iname '*.deb' \
               -o -iname 'latest*.yml' -o -iname '*.blockmap' \) \
            -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-web, build-android, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( \
            -iname '*.zip' -o -iname '*.apk' -o -iname '*.dmg' -o \
            -iname '*.exe' -o -iname '*.AppImage' -o -iname '*.deb' -o \
            -iname 'latest*.yml' -o -iname '*.blockmap' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
