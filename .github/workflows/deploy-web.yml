name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configuration Supabase (hors ligne + service joignable)
        run: node scripts/check-supabase-env.mjs --live
      - name: Types TypeScript
        run: npx tsc --noEmit
      - name: Export web (base path /123Promptez for GitHub Pages)
        run: GH_PAGES_BASE_URL=/123Promptez npx expo export --platform web
      # GH Pages serves 404.html for unknown paths but keeps the URL — copy the
      # SPA shell so client routes like /123Promptez/builder work on refresh.
      - name: SPA fallback (404.html → index)
        run: cp dist/index.html dist/404.html
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
