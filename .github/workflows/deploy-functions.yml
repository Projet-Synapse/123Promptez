name: Deploy Supabase Edge Functions

# Déploie les fonctions Edge automatiquement quand `supabase/functions/**`
# change. Nécessite :
#   - le secret  SUPABASE_ACCESS_TOKEN  (Supabase ▸ Account ▸ Access Tokens)
#   - (optionnel) la variable SUPABASE_PROJECT_REF (réf. du projet, défaut
#     codée ci-dessous). Settings ▸ Secrets and variables ▸ Actions.
# Sans le secret, le job s'exécute mais ignore le déploiement avec un message.

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch: {}

concurrency:
  group: functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # NOTE : le secret créé sur ce dépôt s'appelle SUPABBASE_ACCESS_TOKEN
      # (typo de création) — on accepte les deux orthographes.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SUPABBASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'yvzqbjxngagapskqfcrm' }}
    steps:
      - name: Vérifie la présence du jeton d'accès
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Secret SUPABASE_ACCESS_TOKEN absent — déploiement ignoré. Ajoute-le dans Settings ▸ Secrets ▸ Actions pour activer ce pipeline."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: supabase/setup-cli@v3
        if: steps.guard.outputs.skip != 'true'
        with:
          version: latest
      - name: Déploie la fonction chat
        if: steps.guard.outputs.skip != 'true'
        run: supabase functions deploy chat --project-ref "$SUPABASE_PROJECT_REF"
